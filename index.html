
 !DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organizador de Medicamentos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex justify-center min-h-screen pb-20">

  <div class="w-full max-w-md bg-white min-h-screen shadow-md flex flex-col justify-between relative">
    
    <!-- Cabeçalho -->
    <div>
      <header class="bg-teal-600 text-white p-5 rounded-b-3xl shadow-sm">
        <div class="flex justify-between items-center">
          <div>
            <h1 class="text-xl font-bold">Meus Remédios</h1>
            <p class="text-xs text-teal-100">Organize seus horários de forma simples</p>
          </div>
          <button onclick="abrirModalAdd()" class="bg-white text-teal-700 px-3 py-2 rounded-xl text-xs font-bold shadow-md active:scale-95 flex items-center gap-1">
            <i data-lucide="plus" class="w-4 h-4"></i> Adicionar
          </button>
        </div>
      </header>

      <!-- Lista de Medicamentos -->
      <main class="p-4 space-y-3" id="listaRemedios">
        <!-- Remédios adicionados vão aparecer aqui dinamicamente -->
      </main>
    </div>

    <!-- Barra de Navegação Inferior -->
    <nav class="fixed bottom-0 max-w-md w-full bg-white border-t border-slate-100 p-3 flex justify-around items-center shadow-lg">
      <button onclick="mostrarAba('hoje')" class="flex flex-col items-center gap-1 text-teal-600 font-semibold text-xs">
        <i data-lucide="calendar" class="w-5 h-5"></i> Hoje
      </button>
      <button onclick="abrirBloqueio('família')" class="flex flex-col items-center gap-1 text-slate-400 font-medium text-xs hover:text-slate-600">
        <i data-lucide="users" class="w-5 h-5"></i> Família 
        <span class="bg-amber-100 text-amber-700 text-[10px] px-1.5 rounded-full font-bold">PRO</span>
      </button>
      <button onclick="abrirBloqueio('médico')" class="flex flex-col items-center gap-1 text-slate-400 font-medium text-xs hover:text-slate-600">
        <i data-lucide="stethoscope" class="w-5 h-5"></i> Médico 
        <span class="bg-amber-100 text-amber-700 text-[10px] px-1.5 rounded-full font-bold">PRO</span>
      </button>
    </nav>

  </div>

  <!-- MODAL: Adicionar Medicamento -->
  <div id="modalAdd" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-800 text-base">Novo Medicamento</h3>
        <button onclick="fecharModalAdd()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Nome do Remédio</label>
          <input type="text" id="inputNome" placeholder="Ex: Losartana, Dipirona" class="w-full text-sm border border-slate-200 rounded-xl p-3 focus:outline-none focus:border-teal-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Horário</label>
            <input type="time" id="inputHorario" class="w-full text-sm border border-slate-200 rounded-xl p-3 focus:outline-none focus:border-teal-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Dosagem</label>
            <input type="text" id="inputDose" placeholder="Ex: 50mg, 1 cp" class="w-full text-sm border border-slate-200 rounded-xl p-3 focus:outline-none focus:border-teal-500">
          </div>
        </div>
      </div>
      
      <div class="pt-2 flex gap-2">
        <button onclick="fecharModalAdd()" class="w-1/2 py-3 rounded-xl border border-slate-200 font-semibold text-slate-600 text-sm">Cancelar</button>
        <button onclick="salvarRemedio()" class="w-1/2 py-3 rounded-xl bg-teal-600 text-white font-semibold text-sm shadow-md active:scale-95">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Bloqueio PRO -->
  <div id="modalPro" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center space-y-4">
      <div class="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto">
        <i data-lucide="crown" class="w-6 h-6"></i>
      </div>
      <h3 class="font-bold text-slate-800 text-lg">Recurso Exclusivo PRO</h3>
      <p class="text-xs text-slate-500" id="textoPro">Assine o plano completo para gerenciar lembretes de familiares e relatórios para médicos.</p>
      <button onclick="fecharModalPro()" class="w-full py-3 bg-teal-600 text-white rounded-xl font-bold text-sm shadow-md active:scale-95">Entendi</button>
    </div>
  </div>

  <script>
    let remedios = JSON.parse(localStorage.getItem('meus_remedios')) || [];

    function atualizarTela() {
      const lista = document.getElementById('listaRemedios');
      lista.innerHTML = '';

      if (remedios.length === 0) {
        lista.innerHTML = `
          <div class="text-center py-12 text-slate-400 space-y-2">
            <i data-lucide="pill" class="w-12 h-12 mx-auto stroke-1"></i>
            <p class="text-sm">Nenhum remédio cadastrado ainda.</p>
            <p class="text-xs text-slate-300">Toque em "+ Adicionar" para começar.</p>
          </div>
        `;
      } else {
        remedios.forEach((item, index) => {
          lista.innerHTML += `
            <div class="bg-slate-50 border border-slate-100 p-4 rounded-2xl flex justify-between items-center shadow-sm">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-teal-100 text-teal-700 rounded-xl flex items-center justify-center font-bold">
                  <i data-lucide="clock" class="w-5 h-5"></i>
                </div>
                <div>
                  <h4 class="font-bold text-slate-800 text-sm">${item.nome}</h4>
                  <p class="text-xs text-slate-500">${item.horario} • ${item.dose}</p>
                </div>
              </div>
              <button onclick="removerRemedio(${index})" class="text-slate-300 hover:text-red-500 p-1">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          `;
        });
      }
      lucide.createIcons();
    }

    function abrirModalAdd() {
      document.getElementById('modalAdd').classList.remove('hidden');
    }

    function fecharModalAdd() {
      document.getElementById('modalAdd').classList.add('hidden');
      document.getElementById('inputNome').value = '';
      document.getElementById('inputHorario').value = '';
      document.getElementById('inputDose').value = '';
    }

    function salvarRemedio() {
      const nome = document.getElementById('inputNome').value;
      const horario = document.getElementById('inputHorario').value;
      const dose = document.getElementById('inputDose').value;

      if (!nome || !horario) {
        alert('Por favor, preencha o nome do remédio e o horário.');
        return;
      }

      remedios.push({ nome, horario, dose: dose || '1 dose' });
      localStorage.setItem('meus_remedios', JSON.stringify(remedios));
      fecharModalAdd();
      atualizarTela();
    }

    function removerRemedio(index) {
      remedios.splice(index, 1);
      localStorage.setItem('meus_remedios', JSON.stringify(remedios));
      atualizarTela();
    }

    function abrirBloqueio(recurso) {
      document.getElementById('textoPro').innerText = `O módulo de ${recurso} é exclusivo para assinantes da versão PRO.`;
      document.getElementById('modalPro').classList.remove('hidden');
    }

    function fecharModalPro() {
      document.getElementById('modalPro').classList.add('hidden');
    }

    function mostrarAba(aba) {
      // Aba ativa padrão
    }

    // Inicializa os ícones e carrega a tela
    document.addEventListener('DOMContentLoaded', () => {
      atualizarTela();
    });
  </script>
</body>
</html>
